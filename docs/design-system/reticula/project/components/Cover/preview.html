<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;500;700&family=Roboto:wght@300;400;500&family=Roboto+Condensed:wght@400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:var(--surface)}
svg{display:block;width:960px;height:320px}
.ground{fill:var(--surface)}
.b-signal{fill:var(--signal)}
.b-graphite{fill:var(--graphite)}
.b-ink{fill:var(--ink)}
.b-tint{fill:var(--signal-tint)}
.dots{fill:var(--graphite)}
.lead{fill:var(--signal)}
.name{font-family:var(--font-display);font-weight:300;letter-spacing:.04em;fill:var(--ink)}
.tag{font-family:var(--font-text);font-weight:400;fill:var(--ink-muted)}
</style></head>
<body>
<svg viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RETÍCULA">
<!-- derivación
bloques: signal 224×208 (dot-pitch ×14 por ×13) con chaflán chamfer-lg; graphite 176×96; ink 96×96; signal-tint 64×96; todos a múltiplos de dot-pitch (16).
disposición: losa naranja alta a la izquierda y tres satélites escalonados a su derecha, alineados a la línea inferior de la losa; el nombre queda en el suelo, abajo a la izquierda.
patrón: retícula de puntos (dot-size 4, dot-pitch 16, 2 filas × 27) con barra guía de stroke-bar; elegida porque el sistema es técnico, monoespaciado y se mide en pasos de 16.
pasos y radios: sin radios (radius-0), un solo chaflán de 24px en el bloque signal; márgenes de 32 y 48 (space-6, space-7).
-->

<polygon class="b-signal" points="512,32 712,32 736,56 736,240 512,240"/>
