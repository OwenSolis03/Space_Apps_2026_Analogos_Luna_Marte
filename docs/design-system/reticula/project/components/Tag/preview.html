<!-- @dsCard group="Estado" height=140 subtitle="Etiqueta de estado en tres tonos" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;500;700&family=Roboto:wght@300;400;500&family=Roboto+Condensed:wght@400&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{padding:24px;background:var(--surface);color:var(--ink);font-family:var(--font-text);box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.col{display:grid;gap:24px}
.cap{margin:0 0 8px;color:var(--ink-muted)}
</style></head>
<body><div id="root"></div>
<script>
(function(){
  var R = window.Reticula, h = React.createElement;
  function Cap(t){ return h("p", { className: "label cap" }, t); }

  function App(){
    return h("div", { className: "col" },
      h("div", { className: "row" },
        h(R.Tag, null, "Operativo"),
        h(R.Tag, { tone: "signal" }, "Iniciado"),
        h(R.Tag, { tone: "outline" }, "Comprobado"),
        h(R.Tag, { tone: "outline", bracket: true }, "Seguridad de tripulación"),
        h(R.Tag, { tone: "graphite", bracket: true }, "Error de sistema")));
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script></body></html>
